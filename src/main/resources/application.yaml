spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: 123456
  # 新增 Redis 配置（按任务要求）
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

# ========== 新增 JWT 配置 ==========
security:
  jwt:
    # JWT 签名密钥（后续工具类会用到）
    secret: demo-jwt-secret-key-for-spring-security-2026
    # 有效期：2小时（单位毫秒，7200000 = 2 * 60 * 60 * 1000）
    expiration-millis: 7200000